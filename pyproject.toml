[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laya"
version = "0.3.20"
description = "本地、非生成式的结构化文本决策引擎"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.0",
    "transformers>=4.48",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    "numpy>=1.20",
]

[project.scripts]
laya = "laya.cli:main"

[tool.setuptools]
packages = ["laya"]
